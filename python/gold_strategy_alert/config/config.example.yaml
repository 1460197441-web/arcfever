runtime:
  run_mode: live
  session_mode: market_hours
  enable_test_mode: false
  send_real_email_in_test_mode: false
  history_preload_minutes: 2880

product:
  product_name: ICBC personal accumulation gold
  trading_currency: CNY
  price_refresh_reference_seconds: 3
  min_purchase_grams: 1.0

trading_window:
  start: "09:10:00"
  end: "22:30:00"
  timezone_name: Asia/Shanghai

sampling:
  price_sample_seconds: 60
  decision_interval_minutes: 5
  position_size_grams: 2.0

fees:
  buy_fee_rate: 0.005
  sell_fee_rate: 0.005

indicators:
  # Classic defaults only. They are research starting points, not proven optimal for ICBC accumulation gold.
  atr_period: 14
  bollinger_period: 20
  bollinger_stddev: 2.0
  donchian_entry_period: 20
  donchian_exit_period: 10
  ema_fast_period: 20
  ema_slow_period: 50
  breakout_lookback_bars: 20
  reentry_lookback_bars: 12
  min_ready_bars: 50

strategy:
  stop_loss_cooldown_minutes: 20
  market_open_entry_freeze_minutes: 12
  allow_entry_without_direction_ready: false
  allow_exit_without_full_warmup: true
  no_new_after: "21:50:00"
  force_flatten_at: "22:20:00"
  band_width_expand_bars: 2

risk:
  default_entry_notional_yuan: 1000.0
  max_batches_per_idea: 2
  max_trade_idea_loss_yuan: 20.0
  account_equity_yuan: 10000.0
  daily_drawdown_stop_pct: 0.03
  max_consecutive_losses_before_cooldown: 2
  email_dedupe_minutes: 15
  slightly_aggressive_mode: false
  allow_operational_email: false

email:
  smtp_host: smtp.qq.com
  smtp_port: 465
  username: your@qq.com
  password: your_smtp_auth_code
  use_ssl: true
  recipients:
    - your@qq.com
  subject_prefix: Strategy Alert
  notify_only_actionable: true
  send_operational_email: false

storage:
  sqlite_path: runtime/gold_strategy.db
  log_path: runtime/service.log

providers:
  icbc_provider_name: icbc_accumulated_gold
  icbc_portal_fallback_name: icbc_portal_fallback
  sge_provider_name: sge_au9999
